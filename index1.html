<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ProLit Global Studios - Uundaji wa michezo ya kimataifa kwa kutumia Unreal Engine 4.27">
    <title>ProLit Global Studios | Official Site</title>
    <style>
        :root { --primary: #38bdf8; --success: #4ade80; --dark-bg: #020617; }
        body { background-color: var(--dark-bg); color: #f1f5f9; font-family: 'Inter', sans-serif; margin: 0; text-align: center; }
        .hero { padding: 80px 20px; background: radial-gradient(circle, #1e293b 0%, #020617 100%); }
        .checkout-box {
            max-width: 480px; margin: -40px auto 40px; background: #0f172a;
            border-radius: 20px; padding: 40px; border: 2px solid var(--primary);
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.2);
        }
        .btn-global {
            background: var(--primary); color: #020617; padding: 15px 40px;
            border-radius: 10px; font-weight: bold; text-decoration: none;
            display: inline-block; transition: 0.3s;
        }
        .btn-global:hover { background: var(--success); transform: scale(1.05); }
        .footer-studio { background: #000; padding: 60px 20px; border-top: 1px solid #1e293b; }
    </style>
</head>
<body>
    <section class="hero">
        <h1 style="font-size: 3.5rem; margin: 0; text-shadow: 0 0 15px var(--primary);">PROLIT FINAL</h1>
        <p style="color: var(--primary); letter-spacing: 5px;">GLOBAL GAME DEVELOPMENT STUDIO</p>
    </section>

    <div class="checkout-box">
        <span style="background: var(--success); color: #000; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold;">LIVE WORLDWIDE</span>
        <h2 style="margin-top: 20px;">Mchakato wa Malipo</h2>
        <p>Bidhaa: <strong>ProLit Final Game (Full Access)</strong></p>
        <p style="font-size: 28px; color: var(--success); font-weight: bold;">$0.00 (FREE)</p>
        <hr style="border: 0.5px solid #1e293b; margin: 20px 0;">
        <input type="text" placeholder="Namba ya kupokea link..." style="width: 85%; padding: 12px; border-radius: 8px; border: 1px solid #1e293b; background: #020617; color: white; margin-bottom: 20px;">
        <a href="https://wa.me/255XXXXXXXXX" class="btn-global">IKAMILISHE SASA</a>
        <div style="margin-top: 20px; font-size: 25px;">💳 📱 🔒</div>
    </div>

    <div class="footer-studio">
        <h3 style="color: var(--success);">PROLIT GLOBAL STUDIOS</h3>
        <p style="font-size: 14px; color: #475569;">Powered by iMac Developer Suite & Unreal Engine 4.27</p>
        <p style="font-size: 12px; color: #1e293b; margin-top: 30px;">&copy; 2026 International Gaming Rights Reserved.</p>
    </div>
</body>
</html>
